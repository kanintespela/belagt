id: FOR-18
påstående: 76 procent av de tillfrågade AI-forskarna i AAAI:s enkät bedömde att det är osannolikt eller
  mycket osannolikt att man når AGI genom att skala upp dagens AI-metoder.
typ: mätning
vem: AAAI:s ordförandepanel om AI-forskningens framtid (enkät med 475 svarande)
datum: 2025-03
tema:
- förmågor
- tempo
- röster
källa:
  url: https://aaai.org/wp-content/uploads/2025/03/AAAI-2025-PresPanel-Report-FINAL.pdf
  titel: AAAI 2025 Presidential Panel on the Future of AI Research
  typ: rapport
  citat: The majority of respondents (76%) assert that “scaling up current AI approaches” to yield AGI
    is “unlikely” or “very unlikely” to succeed
  hämtad: '2026-09-28'
  arkiv: null
förbehåll: Enkäten hade 475 svarande, varav omkring 20 procent studenter, och de flesta arbetade inom
  akademin. Den är mindre än AI Impacts enkät (FOR-10) men nyare, och den ger en viktig motbild. Frågan
  gällde att bara skala upp dagens metoder, inte om AGI kan nås över huvud taget.
