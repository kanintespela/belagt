id: ENE-09
påstående: IEA uppskattar att en bred användning av befintliga AI-lösningar kan minska utsläppen med motsvarande
  omkring 5 procent av de energirelaterade utsläppen 2035, vilket är mycket mer än datacentrens utsläpp
  men långt ifrån vad som behövs för att lösa klimatfrågan.
