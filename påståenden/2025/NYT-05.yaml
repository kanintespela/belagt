id: NYT-05
påstående: En 27-miljardersmodell från Google och Yale, C2S-Scale, genererade en ny hypotes om hur kalla
  tumörer kan göras synliga för immunförsvaret, och hypotesen bekräftades sedan experimentellt i levande
  celler.
typ: händelse
vem: Google Research, Google DeepMind och Yale University
