id: KIN-34
påstående: Kinas handlingsplan för global AI-styrning från juli 2025 stöder att FN inrättar två mekanismer
  för AI, en internationell vetenskaplig panel och en global dialog om AI-styrning, och att de kommer igång
  så snart som möjligt.
