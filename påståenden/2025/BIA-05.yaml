id: BIA-05
påstående: Enligt en skriftlig fråga i riksdagen konstaterade ISF 2018 att Försäkringskassans algoritm
  i sin dåvarande utformning inte uppfyllde kraven på likabehandling. Försäkringskassan ansåg att analysen
  var bristfällig.
