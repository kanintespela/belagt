förbehåll: Ur statsrådets yttrande om handlingsprogrammet AI+ (国发〔2025〕11号). Samma stycke sätter målet
  till över 90 procent till 2030 och säger att Kina till 2035 ska ha gått in i en ny fas som intelligent
  ekonomi och intelligent samhälle. Det är politiska mål, inte prognoser från någon oberoende bedömare,
  och det framgår inte hur spridningen ska mätas.
