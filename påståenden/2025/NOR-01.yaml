  titel: Digdir etablerer KI Norge
  typ: myndighet
  citat: Sammen med Nkom og Datatilsynet skal vi tilby felles veiledning og en regulatorisk sandkasse for kunstig
    intelligens. … Regjeringen har gitt 30 millioner til etablering av KI Norge, regulatorisk sandkasse for
    kunstig intelligens og KI-tilsyn.
  språk: 'no'
  översättning: Tillsammans med Nkom och Datatilsynet ska vi erbjuda gemensam vägledning och en regulatorisk
    sandlåda för artificiell intelligens. … Regeringen har gett 30 miljoner för att etablera KI Norge, en regulatorisk
    sandlåda för artificiell intelligens och tillsyn av AI.
