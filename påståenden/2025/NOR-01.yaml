förbehåll: Beloppet är i norska kronor. Enligt samma källa skulle KI Norge öppna i augusti 2026. Sandlådan
  ska hjälpa företag att uppfylla kraven i EU:s AI-förordning, som Norge inför genom EES-avtalet.
