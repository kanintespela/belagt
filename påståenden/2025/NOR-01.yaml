id: NOR-01
påstående: Norges digitaliseringsdirektorat byggde under 2025 upp KI Norge, en nationell arena för AI som tillsammans
  med telemyndigheten Nkom och Datatilsynet ska erbjuda vägledning och en regulatorisk sandlåda för AI. Regeringen
  anslog 30 miljoner kronor.
typ: händelse
