id: SVS-04
påstående: Svenska kraftnät uppgav 2025 att ansökningarna från datacenter bara i Mellansverige motsvarade
  över 5 000 megawatt, ungefär lika mycket som 20 städer av Uppsalas storlek eller produktionen från fem
  kärnkraftsreaktorer.
typ: mätning
vem: Daniel Gustafsson (Svenska kraftnät), intervjuad av Ekot
datum: '2025'
tema:
- miljö
