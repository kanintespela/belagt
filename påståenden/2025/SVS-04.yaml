  titel: 'Varningen: Stora datacenter kan höja elpriset | Sveriges Radio'
  typ: media
  citat: Vi har idag ansökningar på 5000 MW bara i Mellansverige. Det är ungefär så mycket som 20 stycken
    städer av Uppsalas storlek, eller motsvarande produktionen från fem kärnkraftsreaktorer.
  hämtad: '2026-09-28'
  arkiv: https://web.archive.org/web/20260902183549/https://www.sverigesradio.se/artikel/varningen-stora-datacenter-kan-hoja-elpriset
förbehåll: Året står inte i den hämtade texten, men ansökningarna jämförs med 2024. Ansökningarna i elområde
  3 ökade från 1 310 megawatt 2024 till 6 692 megawatt, och huvuddelen gällde ett trettiotal datacenter.
