id: FOR-25
påstående: I en liten pilotstudie från METR och Forecasting Research Institute gav experter på AI-prognoser
  en median på 20 procents sannolikhet för att uppskalningen av effektiv beräkningskraft trefaldigas i takt
  till 2029. Superprognosmakare bedömde sannolikheten till 8 procent.
typ: prognos
