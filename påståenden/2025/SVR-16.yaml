förbehåll: Många har alltså aldrig provat AI, och ännu färre har provat de betalda versionerna. Användningen
  är ojämnt fördelad, till exempel 56 procent bland tjänstemän mot 30 procent bland arbetare och 11 procent
  bland pensionärer.
