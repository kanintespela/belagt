id: SVR-16
påstående: Andelen svenskar 18–84 år som använder AI-verktyg har ökat från 29 procent 2023 till 39 procent
  2025. Det betyder att mer än hälften av befolkningen ännu inte har använt dem.
typ: mätning
vem: Internetstiftelsen, Svenskarna och internet 2025
