  översättning: Märkning av AI-genererat och syntetiskt innehåll omfattar synlig märkning och dold märkning.
  översatt_av: Claude (AI)
  granskad_av: null
förbehåll: Reglerna gäller från 2025-09-01 (§ 14). Synlig märkning är text, ljud eller grafik som användaren
  märker. Dold märkning läggs in i filens metadata och anger bland annat leverantör och innehållsnummer.
  Den som vill ha innehåll utan synlig märkning kan få det mot ett användaravtal, och uppgifterna sparas
  då i minst sex månader (§ 9). Primärkällan till KIN-04.
