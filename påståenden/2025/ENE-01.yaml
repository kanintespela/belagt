förbehåll: Rapporten publicerades i april 2025; månaden står inte i den hämtade texten. Förbrukningen
  har vuxit med omkring 12 procent per år sedan 2017, mer än fyra gånger snabbare än den totala elförbrukningen.
  Siffrorna gäller alla datacenter, inte bara AI.
