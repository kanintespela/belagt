id: ENE-01
påstående: Datacenter stod 2024 för omkring 1,5 procent av världens elförbrukning, 415 terawattimmar.
  USA stod för 45 procent av datacentrens förbrukning, Kina för 25 och Europa för 15.
typ: mätning
vem: IEA (Internationella energirådet), rapporten Energy and AI
