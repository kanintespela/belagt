påstående: USA:s upphovsrättsmyndighet bedömer att den kopiering som sker när AI tränas hotar att allvarligt
  skada marknaden för eller värdet av upphovsrättsskyddade verk.
typ: bedömning
vem: USA:s upphovsrättsmyndighet (U.S. Copyright Office)
