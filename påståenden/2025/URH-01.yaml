  titel: 'US Copyright Office: Generative AI Training (maj 2025)'
  typ: myndighet
  citat: The copying involved in AI training threatens significant potential harm to the market for or
    value of copyrighted works.
  hämtad: '2026-09-28'
  arkiv: null
förbehåll: Rapportens förhandsversion publicerades i maj 2025; datumet står inte i citatet. Myndigheten
