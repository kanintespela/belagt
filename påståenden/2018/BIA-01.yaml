  arkiv: https://web.archive.org/web/20260927084551/http://proceedings.mlr.press/v81/buolamwini18a/buolamwini18a.pdf
förbehåll: Studien heter Gender Shades och blev ett klassiskt exempel på hur AI kan vara partisk. Den
  testade tre kommersiella system. Flera av företagen förbättrade sina system efteråt, så siffrorna gäller
  2018.
