id: BIA-01
påstående: En studie från 2018 visade att kommersiella system för att känna igen kön i ansiktsbilder gjorde
  upp till 34,7 procent fel för kvinnor med mörk hy, men högst 0,8 procent fel för män med ljus hy.
typ: mätning
vem: Joy Buolamwini (MIT) och Timnit Gebru (Microsoft Research)
datum: '2018'
tema:
- rättigheter
