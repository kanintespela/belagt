id: BIA-02
påstående: En granskning av Lighthouse Reports och Svenska Dagbladet visade att Försäkringskassans algoritm
  för att förutsäga fusk med tillfällig föräldrapenning diskriminerade kvinnor, personer med utländsk
  bakgrund, låginkomsttagare och personer utan universitetsutbildning.
