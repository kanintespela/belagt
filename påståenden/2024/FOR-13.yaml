id: FOR-13
påstående: Medianbedömningen bland AI-forskarna var 5 procents sannolikhet för extremt dåliga följder
  av avancerad AI, som att mänskligheten utrotas. Över en tredjedel (38 procent) angav minst 10 procent.
typ: mätning
vem: AI Impacts (Grace m.fl.), enkät bland 2 778 AI-forskare
datum: 2024-01
tema:
- kontroll
- röster
källa:
  url: https://arxiv.org/abs/2401.02843
  titel: 'AI Impacts: Thousands of AI Authors on the Future of AI (2024)'
  typ: preprint
  citat: The median prediction for extremely bad outcomes, such as human extinction, was 5% (mean 9%).
    Over a third of participants (38%) put at least a 10% chance on extremely bad outcomes.
  hämtad: '2026-09-28'
  arkiv: null
förbehåll: Medelvärdet var 9 procent, ned från 14 procent i enkäten 2022. Beroende på hur frågan formulerades
  angav mellan 38 och 51 procent minst 10 procent. Återge det som forskarnas bedömning, inte som ett mått
  på risken.
