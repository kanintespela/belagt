  url: https://www.nobelprize.org/prizes/physics/2024/hinton/speech/
  titel: Nobel Prize in Physics 2024
  typ: opinion
  citat: But we now have evidence that if they are created by companies motivated by short-term profits,
    our safety will not be the top priority.
  hämtad: '2026-09-22'
  arkiv: https://web.archive.org/web/20261004191328/https://www.nobelprize.org/prizes/physics/2024/hinton/speech/
förbehåll: 'Svensk koppling: varningen framfördes vid Nobelbanketten. Hinton nämner också kortsiktiga
  risker: övervakning, nätfiske, virus och autonoma vapen. Han säger att nyttan kan bli fantastisk om
  den fördelas rättvist.'
