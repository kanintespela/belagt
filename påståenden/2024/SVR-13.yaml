id: SVR-13
påstående: När Geoffrey Hinton tog emot Nobelpriset i fysik i Stockholm 2024 varnade han i sitt bankettal
  för att AI kan bli ett existentiellt hot, och för att säkerheten inte prioriteras när AI byggs av företag
  som drivs av kortsiktiga vinster.
typ: bedömning
vem: Geoffrey Hinton (Nobelpristagare i fysik 2024), bankettal i Stockholms stadshus
datum: '2024-12-10'
tema:
- röster
- kontroll
