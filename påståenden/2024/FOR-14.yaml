id: FOR-14
påstående: 68 procent av AI-forskarna trodde att goda följder av övermänsklig AI är mer sannolika än dåliga,
  men nästan hälften av dessa optimister angav ändå minst 5 procents risk för extremt dåliga följder som
  att mänskligheten utrotas.
typ: mätning
