förbehåll: Ersätter TID-11, som byggde på Future of Life Institutes sammanfattning. Enligt samma sida sköts
  reglerna för AI-system inom vissa högriskområden upp till den 2 december 2027 genom ändringsförordningen
  AI Omnibus, som trädde i kraft den 27 juli 2026. Sidan uppdateras löpande.
