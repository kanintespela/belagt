id: FOR-02
påstående: I en pilotstudie gav experter på AI-prognoser en median på 20 procents sannolikhet för att
  de närmaste årens framsteg kan pressa ihop sex års utveckling (2018–2024) på två år. Så kallade superprognosmakare,
  skickliga generalister på prognoser, bedömde sannolikheten till 8 procent.
typ: prognos
vem: Forecasting Research Institute, återgivet i International AI Safety Report 2026
datum: '2026-02-03'
tema:
