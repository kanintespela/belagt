  titel: International AI Safety Report 2026
  typ: rapport
  citat: AI forecasting experts gave a median 20% probability, while superforecasters (skilled generalist
    forecasters) estimated only 8%.
  hämtad: '2026-09-24'
  arkiv: https://web.archive.org/web/20260914230800/https://arxiv.org/abs/2602.21012
förbehåll: Frågan gällde om AI som hjälper till med AI-forskning kan få utvecklingen att accelerera dramatiskt.
  Att de två grupperna skiljer sig så mycket är i sig ett belägg för hur osäkert läget är.
