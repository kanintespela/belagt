id: NYT-02
påstående: I den svenska MASAI-studien gav AI-stödd mammografiscreening 29 procent fler upptäckta cancerfall,
  samtidigt som radiologernas granskningsarbete minskade med 44 procent.
typ: mätning
vem: Kristina Lång (docent i diagnostisk radiologi, Lunds universitet) och MASAI-studien
datum: 2026-02
tema:
- nytta
källa:
  url: https://www.lunduniversity.lu.se/article/ai-support-breast-cancer-screening-fewer-missed-cancer-cases
  titel: 'AI support in breast cancer screening: Fewer missed cancer cases'
  typ: rapport
  citat: the AI-supported screening method was safe and resulted in 29 percent more detected cancers,
    mostly small, lymph node negative invasive cancers. The strategy also made the screening more efficient
    since the screen-reading workload for radiologists was reduced by 44 percent
  hämtad: '2026-09-24'
  arkiv: https://web.archive.org/web/20260817154503/https://www.lunduniversity.lu.se/article/ai-support-breast-cancer-screening-fewer-missed-cancer-cases
förbehåll: MASAI är den första randomiserade kontrollerade studien av AI i cancerscreening, med 106 000
  svenska kvinnor på fyra orter. Randomiserad design väger tyngre än de leverantörspåståenden som annars
  dominerar. Detta är ett smalt bildigenkänningssystem, inte en generell modell.
