id: SVE-04
påstående: Olle Häggström, professor vid Chalmers, kallar det bisarrt att AI nästan inte diskuterades
  i valrörelsen 2026, och menar att AI kommer att påverka i stort sett alla samhällssektorer under mandatperioden.
typ: bedömning
vem: Olle Häggström (professor i matematisk statistik, Chalmers)
datum: '2026-08-14'
tema:
- röster
- styrning
