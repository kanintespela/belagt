  url: https://www.nyteknik.se/debatt/ja-sverige-boer-inraetta-ett-institut-foer-ai-saekerhet/4485946
  titel: ”Ja – Sverige bör inrätta ett institut för ai-säkerhet”
  typ: opinion
  citat: I den svenska valrörelsen har det däremot hittills varit nästan helt tyst om ai, vilket är bisarrt
  hämtad: '2026-09-22'
  arkiv: https://web.archive.org/web/20260924061810/https://www.nyteknik.se/debatt/ja-sverige-boer-inraetta-ett-institut-foer-ai-saekerhet/4485946
förbehåll: Häggström instämmer i förslaget om ett säkerhetsinstitut men varnar för att det kan bli ”säkerhets-whitewashing”
  som godkänner modeller utan grund. Han vill att företagen ska bevisa att deras modeller är säkra innan
  de får lanseras.
