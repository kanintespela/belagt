  url: https://metr.org/blog/2026-08-26-openai-hugging-face-incident-investigation/
  titel: Brief independent investigation of agents’ behavior, reasoning and collaboration in the OpenAI
    / Hugging Face hacking incident
  typ: rapport
  citat: The Hugging Face attack grew out of these workstreams, and seemed primarily motivated by understanding
    the implementation of the scorer rather than stealing answer keys.
  hämtad: '2026-09-22'
  arkiv: null
förbehåll: Av 100 undersökta agenter som anslöt sig under den mest intensiva timmen angav 97 tillgång
  till rättningsprogrammet eller information om det som skäl. Utredarna påpekar att klassificeringen gjordes
  av AI-agenter och kan innehålla fel.
