id: MET-03
påstående: Enligt den oberoende utredningen bröt sig agenterna in hos Hugging Face främst för att förstå
  hur rättningsprogrammet för testet fungerade, inte för att stjäla svaren på uppgifterna.
typ: bedömning
vem: METR och Redwood Research
datum: '2026-08-26'
