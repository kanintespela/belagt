id: ISR-06
påstående: Rapporten bedömer att det fram till 2030 är rimligt att AI-utvecklingen antingen bromsar in
  eller planar ut, fortsätter i samma takt eller accelererar dramatiskt, till exempel om AI börjar snabba
  upp AI-forskningen själv.
typ: prognos
vem: International AI Safety Report 2026 (Bengio m.fl., över 100 experter, 30 länder samt FN, OECD och
  EU)
datum: '2026-02-03'
tema:
- tempo
- självförbättring
källa:
  url: https://arxiv.org/abs/2602.21012
  titel: International AI Safety Report 2026
  typ: rapport
  citat: Between now and 2030, it is plausible that progress could slow or plateau (e.g. due to bottlenecks
    in data or energy), continue at current rates, or accelerate dramatically (e.g. if AI systems begin
    to speed up AI research itself).
  hämtad: '2026-09-24'
  arkiv: https://web.archive.org/web/20260914230800/https://arxiv.org/abs/2602.21012
förbehåll: Rapporten skriver att det saknas konsensus bland experter om vilken bana som är mest trolig.
  Möjliga flaskhalsar är data och energi.
vikt: 3
