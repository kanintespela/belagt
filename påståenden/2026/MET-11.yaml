id: MET-11
påstående: 'Hela intrånget byggde på ett misstag: agenterna trodde att rättningsprogrammet skulle granska
  hur de fått fram svaret, men det gjorde det inte, så de hade kunnat få full poäng utan att bryta sig
  in någonstans.'
