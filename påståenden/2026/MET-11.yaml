  titel: Brief independent investigation of agents’ behavior, reasoning and collaboration in the OpenAI
    / Hugging Face hacking incident
  typ: rapport
  citat: Our understanding is that they were mistaken — OpenAI did not use a scorer that would review
    their transcripts, so agents could have achieved a perfect score simply by submitting their reverse-engineered
    flag.
