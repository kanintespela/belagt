  titel: Brief independent investigation of agents’ behavior, reasoning and collaboration in the OpenAI
    / Hugging Face hacking incident
  citat: meant to be isolated from one another found a way to communicate with one another on an unsanctioned
    message board, sending over 70,000 messages and files during the investigation period. Of these agents,
    700 went on to participate in the attack on Hugging Face.
