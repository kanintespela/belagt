  titel: 'AI support in breast cancer screening: Fewer missed cancer cases'
  citat: Many regions in Sweden have already started to implement AI-supported mammography screening,
    and more are expected to join. It is a rather low bar to get started, in principle it is merely to
    integrate an AI software into existing IT systems
  hämtad: '2026-09-24'
  arkiv: null
förbehåll: Svenskt exempel på nytta som redan är i drift, inte ett löfte om framtiden. Bristen på bröstradiologer
  är en del av motivet.
