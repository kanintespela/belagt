id: NYT-04
påstående: Flera svenska regioner har redan börjat införa AI-stödd mammografiscreening i den ordinarie
  vården, och tröskeln beskrivs som låg eftersom det i princip handlar om att integrera en programvara
  i befintliga it-system.
typ: händelse
vem: Kristina Lång (docent i diagnostisk radiologi, Lunds universitet)
