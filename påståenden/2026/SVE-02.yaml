id: SVE-02
påstående: Centerpartiet vill inrätta ett svenskt AI-säkerhetsinstitut som kan säkerhetsgranska de mest
  kraftfulla AI-modellerna och bidra till att begränsa utvecklingen när riskerna är betydande.
typ: förslag
vem: Centerpartiet
datum: '2026'
tema:
- styrning
källa:
  url: https://www.centerpartiet.se/centerpartiets-politik/centerpartiets-politik-a-o/digitalisering/artificiell-intelligens-ai
  titel: Artificiell intelligens (AI)
  typ: partsuppgift
  citat: Institutet ska kunna bidra till att begränsa utvecklingen vid betydande risker och stärka internationellt
    samarbete om ansvarsfull AI-utveckling.
  hämtad: '2026-09-22'
  arkiv: https://web.archive.org/web/20260913191204/https://www.centerpartiet.se/centerpartiets-politik/centerpartiets-politik-a-o/digitalisering/artificiell-intelligens-ai
förbehåll: Centerpartiet beskriver sig som teknikoptimister men inte naiva. Partiet vill också ha stöd
  till bibliotek och civilsamhälle för folkbildning om AI. Partiledningen skrev om AI-risk i Ny Teknik
  den 12 augusti 2026.
