id: NYT-03
påstående: 'MASAI-studiens slutresultat visade 12 procent färre intervallcancrar med AI-stödd screening,
  och de som ändå uppstod hade en gynnsammare profil: 27 procent färre aggressiva subtyper.'
typ: mätning
vem: Kristina Lång (docent i diagnostisk radiologi, Lunds universitet) och MASAI-studien
