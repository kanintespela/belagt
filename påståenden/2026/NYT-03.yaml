  titel: 'AI support in breast cancer screening: Fewer missed cancer cases'
  citat: Overall, there were 12 per cent fewer interval cancers with AI-supported screening compared to
    standard screening (82 compared to 93).
  hämtad: '2026-09-24'
  arkiv: null
förbehåll: Intervallcancer är cancer som upptäcks mellan två screeningtillfällen och är typiskt mer aggressiv.
  Lång kallar den frekvensen ett centralt mått på hur effektiv en screeningmetod är. Känsligheten ökade
  utan fler falsklarm.
