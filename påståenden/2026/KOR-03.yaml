id: KOR-03
påstående: Sydkoreas regering skjuter upp tillsynen enligt AI-grundlagen i minst ett år, så att företagen hinner
  förbereda sig. Under den tiden ska utredningar bara göras i undantagsfall, till exempel vid dödsfall eller
  allvarliga kränkningar av mänskliga rättigheter.
