id: SVR-19
påstående: Stockholmsbolaget Lovable, som låter människor utan programmeringskunskaper bygga appar genom
  att chatta med AI, värderades i augusti 2026 till 13,3 miljarder dollar, alltså 127 miljarder kronor.
  Det är mer än börsvärdet för SKF, Skanska och Securitas.
