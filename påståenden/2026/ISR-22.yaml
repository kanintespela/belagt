id: ISR-22
påstående: Enligt rapporten syns ännu ingen effekt av AI på den totala sysselsättningen, men det finns
  tecken på att efterfrågan på personer i början av karriären har minskat i vissa yrken som är mycket
  utsatta för AI, till exempel skrivande.
