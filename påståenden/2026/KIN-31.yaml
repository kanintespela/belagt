id: KIN-31
påstående: Kinas regler för AI-kompanjoner, som fem myndigheter publicerade i april 2026, gäller från den 15
  juli 2026 och kräver bland annat att tjänsterna vägleder äldre användare och tydligt varnar dem för risker.
typ: händelse
vem: Kinas cyberrymdsmyndighet (CAC) och fyra andra myndigheter
datum: '2026-04-10'
tema:
- styrning
- samhälle
