  url: https://www.cac.gov.cn/2026-04/10/c_1777558395078289.htm
  titel: 人工智能拟人化互动服务管理暂行办法
  typ: myndighet
  citat: 自2026年7月15日起施行。… 拟人化互动服务提供者向老年人提供服务的，应当加强对老年人健康使用服务的指导，以显著方式提示安全风险
  språk: zh
  översättning: Gäller från den 15 juli 2026. … Den som tillhandahåller människolika interaktiva tjänster till
    äldre ska ge äldre bättre vägledning i att använda tjänsten på ett sunt sätt och på ett tydligt sätt varna
    för säkerhetsrisker
  översatt_av: Claude (AI)
