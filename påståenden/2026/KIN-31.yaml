  arkiv: null
förbehåll: Ersätter KIN-02, som återgav reglerna via Concordia AI. Kraven på suicidprevention, beroende och
  minderåriga finns i samma regler, se KIN-09 till KIN-12. Reglerna innehåller också politiska innehållskrav,
  se KIN-13.
