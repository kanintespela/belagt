förbehåll: Nästan hälften vill också kunna stänga av AI-system i nödfall. Futurion är en tankesmedja knuten
  till tjänstemannafacken. Hämta rapporten för metod och urval. Futurions egen rapport (https://futurion.se/wp-content/uploads/2026/06/futurion-x-seismic-rapport-ai-2026-2-juni.pdf)
  har siffrorna bara som bilder, så citatet kan inte kontrolleras maskinellt mot originalet. Fältarbetet gjordes
  12–20 mars 2026.
