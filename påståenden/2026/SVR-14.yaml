id: SVR-14
påstående: Enligt en undersökning från juni 2026 anser bara 10 procent av svenskarna att AI är tillräckligt
  reglerat, medan 51 procent tycker att tillsynen är otillräcklig. Hälften vill att AI-bolag ska kunna hållas
  skadeståndsansvariga.
