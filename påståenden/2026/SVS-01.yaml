  titel: 'Ratio Working Paper No. 388: Same Storm, Different Boats: Generative AI and the Age Gradient
    in Hiring - Ratio'
  citat: An event study documents an accelerating decline in employment of 22–25-year-olds in high-AI-exposure
    occupations, reaching 5.5 per cent by early 2025 relative to less exposed occupations within the same
    employers, while employment of workers over 50 rose by 1.3 per cent.
