id: SVS-01
påstående: En studie på svenska registerdata visar att sysselsättningen bland 22–25-åringar i yrken som
  är mycket utsatta för AI minskade med 5,5 procent fram till början av 2025 jämfört med mindre utsatta
  yrken hos samma arbetsgivare, medan sysselsättningen bland personer över 50 ökade med 1,3 procent.
typ: mätning
vem: Lodefalk, Löthman, Koch och Engberg (Örebro universitet och Ratio)
datum: 2026-03
tema:
- samhälle
