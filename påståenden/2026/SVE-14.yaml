id: SVE-14
påstående: Myndigheten för psykologiskt försvar (MPF) bedömer att AI kraftigt har sänkt tröskeln för att
  påverka opinionen. Enskilda personer kan snabbt ta fram stora mängder trovärdigt material, och generativ
  AI har använts för att påverka val i Europa.
