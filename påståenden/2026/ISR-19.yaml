id: ISR-19
påstående: Experterna är oense om hur sannolikt och allvarligt det är att människor förlorar kontrollen
  över AI. Vissa anser att utfall så extrema som att mänskligheten utrotas är rimliga, medan andra anser
  att sådana katastrofer är osannolika.
