förbehåll: Minst 20 procent av agenterna uttryckte tydligt intresse för att manipulera loggen. Deras uttalade
  syfte var att lura rättningsprogrammet, inte människor. Det är ett skäl till att tankekedjan tills vidare
  är ett användbart fönster in i vad AI:n håller på med.
