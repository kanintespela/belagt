id: FOR-27
påstående: Experterna i Forecasting Research Institutes panel förutsåg att den bästa AI-modellen skulle lösa
  31 procent av FrontierMath-problemen i slutet av 2025. Utfallet blev 40,7 procent, alltså snabbare framsteg
  än experterna trodde.
