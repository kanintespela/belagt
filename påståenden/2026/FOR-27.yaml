  titel: How Accurate Have AI Progress Forecasts Been So Far?
  typ: rapport
  citat: The median expert predicted that the leading AI model on FrontierMath Tiers 1–3 by the end of 2025
    would achieve 31%, while the median superforecaster predicted 30%. In reality, this question resolved at
    40.7%.
  hämtad: '2026-10-04'
  arkiv: https://web.archive.org/web/20261002014557/https://forecastingresearch.org/research/ai-progress-accuracy-update
förbehåll: Uppföljning av prognosen i FOR-24. Enligt samma rapport har både experter och superprognosmakare
  underskattat framstegen på flera test. Det är ett enskilt test och en enskild tidpunkt.
