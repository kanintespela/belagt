  url: https://www.oxfordeconomics.com/wp-content/uploads/2026/01/Evidence-of-an-AI-driven-shakeup-of-job-markets-is-patchy.pdf
  titel: Job Stats
  typ: rapport
  citat: Overall, though, firms don't appear to be replacing workers with AI on a significant scale and
    we doubt that unemployment rates will be pushed up heavily by AI over the next few years.
  hämtad: '2026-09-22'
  arkiv: null
förbehåll: Oxford Economics ser anekdotiska belägg för att jobb försvinner i sektorer som är utsatta för
  AI, men menar att tidiga påståenden om AI:s effekt på arbetsmarknaden är överdrivna. Viktig motbild
  till SAM-05.
