id: SAM-01
påstående: Oxford Economics bedömde i januari 2026 att företag inte verkar ersätta arbetstagare med AI
  i någon större skala, och att AI inte kommer att driva upp arbetslösheten kraftigt under de närmaste
  åren.
typ: bedömning
vem: Oxford Economics (analysföretag, Ben May och Yasmine Badawy)
datum: '2026-01-07'
tema:
- samhälle
