id: ISR-02
påstående: 'Rapporten beskriver ett evidensdilemma: AI-systemen blir snabbt mer kapabla, men belägg om
  riskerna kommer långsamt och är svåra att bedöma. Den som agerar för tidigt riskerar att låsa fast verkningslösa
  åtgärder, och den som väntar på säkra data kan lämna samhället sårbart.'
