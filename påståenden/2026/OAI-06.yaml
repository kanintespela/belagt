förbehåll: Christiano är också teknisk rådgivare vid amerikanska CAISI. OpenAI skriver att han tar risken
  för katastrofala följder av avancerad AI på allvar och har varit en oberoende röst om huruvida branschens
  skyddsåtgärder räcker. Han är observatör utan rösträtt i bolagsstyrelsen. Hans eget uttalande om risken
  för kontrollförlust finns bara på x.com och har inte gått att hämta.
