name: Bevakning

on:
  schedule:
    - cron: "7 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  bevaka:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ETIKETT: bevakning
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Läs de bevakade flödena
        run: python tools/bevaka.py > rapport.md
      - name: Skapa eller uppdatera veckans ärende
        run: |
          if [ ! -s rapport.md ]; then echo "Inget nytt."; exit 0; fi
          # Förra veckans ärende stängs, så att det öppna alltid är det aktuella.
          for n in $(gh issue list --label "$ETIKETT" --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Ersatt av veckans lista."
          done
          gh label create "$ETIKETT" --color 0E8A16 --description "Tips från de bevakade källorna" 2>/dev/null || true
          gh issue create --title "Nytt att granska, vecka $(date +%G-%V)" --label "$ETIKETT" --body-file rapport.md
