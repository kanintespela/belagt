name: Kontroll

on:
  pull_request:
  push:
    branches: [main]

jobs:
  kontroll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Validera påståenden och kontrollera att genererade filer är aktuella
        run: python tools/bygg.py --kontroll
